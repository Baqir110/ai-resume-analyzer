  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-resume-analyzer:latest
    container_name: ai-resume-dashboard
    command: >
      streamlit run app/dashboard/main.py
        --server.address 0.0.0.0
        --server.port 8501
        --server.headless true
        --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      FASTAPI_API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
