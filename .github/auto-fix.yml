name: Auto-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Auto-fix
        run: |
          ruff check app --fix || true
          ruff format app
          isort app

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-fix formatting and imports"
          title: "🤖 Auto-fix: lint and formatting"
          body: |
            Automated fixes from ruff, black, and isort.
            Review the diff before merging.
          branch: autofix/${{ github.ref_name }}
          delete-branch: true
          labels: automated
