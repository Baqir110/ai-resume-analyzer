repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending

  # ruff and ruff-format removed: they rewrote files during a commit, which
  # pre-commit treats as a failure, so the commit was aborted and had to be
  # retyped. Linting still runs in CI (.github/workflows/ci.yml).
  #
  # Re-enable once the codebase is formatted to a single style:
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.8.0
  #   hooks:
  #     - id: ruff
  #       args: [--fix, --exit-non-zero-on-fix]
  #     - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Re-enable once the codebase is fully typed
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests, types-python-dateutil]
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       files: ^app/

  - repo: local
    hooks:
      # The update-readme hook was removed for the same reason as ruff: it
      # rewrote README.md during the commit, so the commit was aborted and had
      # to be retyped. `python scripts/update_readme.py` still works by hand.
      #
      # --- Pre-push stage ---
      - id: compile-check
        name: Python compile check
        entry: python -m compileall -q app
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-fast
        name: Fast test suite
        entry: python -m pytest -m "not integration" -q --maxfail=1
        language: system
        pass_filenames: false
        stages: [pre-push]
