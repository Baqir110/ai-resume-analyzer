repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-ast          # ← syntax errors blocked at commit
      - id: debug-statements   # catches leftover breakpoint()
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests, types-python-dateutil]
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       files: ^app/
  - repo: local
    hooks:
      - id: compile-check
        name: Python compile check
        entry: python -m compileall -q app
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-fast
        name: Fast test suite
        entry: python -m pytest -m "not integration" -q --maxfail=1
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: update-readme
        name: Update README
        entry: python scripts/update_readme.py
        language: system
        pass_filenames: false
        files: ^(app/|tests/|scripts/update_readme\.py|README\.md)
